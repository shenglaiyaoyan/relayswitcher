name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: node --test test/catalog.test.js test/buildAuthJson.test.js test/patchProviderBlock.test.js test/catalog-extract.test.js
      - name: Build renderer
        run: npx vite build
      - name: Package (dir only, no installer)
        run: npx electron-builder --win --dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
