<!DOCTYPE html><html><head><style>
    *{margin:0;padding:0}
    html,body{background:transparent;width:24px;height:24px;overflow:hidden}
    svg{display:block;width:24px;height:24px}
  </style></head><body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8d5b7"/>
      <stop offset=".55" stop-color="#c9b8a0"/>
      <stop offset="1" stop-color="#a78b71"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".36" r=".8">
      <stop offset="0" stop-color="#c9b8a0" stop-opacity=".30"/>
      <stop offset="1" stop-color="#c9b8a0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.4" fill="#ffffff" opacity="0.10"/>
    </pattern>
  </defs>

  <!-- 底板 -->
  <rect x="10" y="10" width="236" height="236" rx="58" fill="#0d0d0c"/>
  <rect x="10" y="10" width="236" height="236" rx="58" fill="url(#dots)"/>
  <rect x="10" y="10" width="236" height="236" rx="58" fill="url(#glow)"/>
  <!-- 玻璃描边 -->
  <rect x="11" y="11" width="234" height="234" rx="57" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="2"/>
  <rect x="11" y="11" width="234" height="234" rx="57" fill="none" stroke="rgba(167,139,113,0.28)" stroke-width="0.8"/>

  <!-- ⇄ 双向箭头:上→ 右,下← 左 -->
  <g stroke="url(#gold)" stroke-width="15" stroke-linecap="round" fill="none">
    <path d="M 76 107 H 168"/>
    <path d="M 180 149 H 88"/>
  </g>
  <g fill="url(#gold)">
    <path d="M 160 86 L 198 107 L 160 128 Q 170 107 160 86 Z"/>
    <path d="M 96 128 L 58 149 L 96 170 Q 86 149 96 128 Z"/>
  </g>

  <!-- 中央节点 -->
  <circle cx="128" cy="128" r="7" fill="#0d0d0c" stroke="url(#gold)" stroke-width="5"/>
</svg>
</body></html>
