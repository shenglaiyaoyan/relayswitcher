<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>ChatGPT 页 C · 比例重做</title>
<style>
body{margin:0;background:#0a0a0a;color:#e8d5b7;font-family:Inter,"Microsoft YaHei",sans-serif;font-size:15px}
header{position:sticky;top:0;z-index:2;background:#111;border-bottom:1px solid #2a241e;padding:12px 24px;display:flex;gap:14px;align-items:center}
header a{color:#e8d5b7;text-decoration:none;border:1px solid #a78b71;border-radius:8px;padding:6px 14px}
section{padding:26px 28px 34px;border-bottom:1px solid #1c1915}
h2{margin:0 0 6px;font-size:20px}
ul{margin:0 0 16px;color:#b8a892;line-height:1.8;padding-left:20px}
img{width:100%;max-width:1500px;display:block;border:1px solid #2a241e;border-radius:10px}
</style></head><body>
<header><b>C 比例重做：</b><a href="#one">① 均衡两栏</a><a href="#two">② 紧凑三段</a></header>
<section id="one"><h2>① 均衡两栏</h2><ul>
<li>左：切换表单 + 全宽「立即切换」+ 横向五步进度；下面接「最近备份」</li>
<li>右：当前状态整列，分「登录态 / 流量出口 / Codex」三组</li>
<li>两栏底部对齐，主按钮最醒目</li></ul>
<img src="C2-balanced.png"></section>
<section id="two"><h2>② 紧凑三段</h2><ul>
<li>左：切换表单，「立即切换」靠右；下面是每步一行的流程清单（带说明）</li>
<li>右：上半当前状态（更紧凑），下半最近备份</li>
<li>左栏更宽，表单输入更舒展</li></ul>
<img src="C3-compact.png"></section>
</body></html>
