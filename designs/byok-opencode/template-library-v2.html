          <button class="template-item" type="button" aria-pressed="false"><span class="item-top"><strong>Grok</strong><span class="tag">内置</span></span><span class="item-meta"><code>grok-*</code><span class="caps" aria-label="推理、附件、工具、Temp均开"><i class="on">推理</i><i class="on">附件</i><i class="on">工具</i><i class="on">Temp</i></span><span class="tier"><b>500K / 500K</b> · <b>4</b> 档</span></span></button>
          <button class="template-item" type="button" aria-pressed="false"><span class="item-top"><strong>MiniMax</strong><span class="tag">内置</span></span><span class="item-meta"><code>minimax-*</code><span class="caps" aria-label="推理开、附件关、工具开、Temp开"><i class="on">推理</i><i>附件</i><i class="on">工具</i><i class="on">Temp</i></span><span class="tier"><b>1M / 512K</b> · 思考开关</span></span></button>
          <button class="template-item" type="button" aria-pressed="false"><span class="item-top"><strong>Mistral</strong><span class="tag">内置</span></span><span class="item-meta"><code>mistral-*</code><span class="caps" aria-label="推理、附件、工具、Temp均开"><i class="on">推理</i><i class="on">附件</i><i class="on">工具</i><i class="on">Temp</i></span><span class="tier"><b>1M / 256K</b> · <b>2</b> 档</span></span></button>
          <button class="template-item" type="button" aria-pressed="false"><span class="item-top"><strong>MiMo</strong><span class="tag">内置</span></span><span class="item-meta"><code>mimo-*</code><span class="caps" aria-label="推理开、附件关、工具开、Temp开"><i class="on">推理</i><i>附件</i><i class="on">工具</i><i class="on">Temp</i></span><span class="tier"><b>1M / 128K</b> · 思考开关</span></span></button>
          <button class="template-item" type="button" aria-pressed="false"><span class="item-top"><strong>公司内网 GPT</strong><span class="tag custom">自定义</span></span><span class="item-meta"><code>internal-gpt-*</code><span class="caps" aria-label="推理、附件、工具、Temp均开"><i class="on">推理</i><i class="on">附件</i><i class="on">工具</i><i class="on">Temp</i></span><span class="tier">自定义</span></span></button>
        </div></aside>
        <form class="editor" aria-label="编辑 Claude 模型模板">
          <div class="editor-head"><div><p class="editor-kicker">正在编辑</p><h2>Claude</h2></div><span class="tag">内置模板</span></div>
          <section class="form-section" aria-labelledby="match-title"><h3 id="match-title">匹配</h3><div class="match-grid"><div class="field"><label for="template-name">模板名</label><input class="input" id="template-name" value="Claude"></div><div class="field"><label for="match-rule">匹配规则</label><input class="input rule-input" id="match-rule" value="claude-* , anthropic/claude-*" spellcheck="false"><p class="hint">命中 <span class="mono">3</span> 个已拉取模型</p></div></div></section>
          <section class="form-section" aria-labelledby="limits-title"><h3 id="limits-title">限制</h3><div class="two-col"><div class="field"><label for="context-limit">上下文（tokens）</label><input class="input mono" id="context-limit" inputmode="numeric" value="1000000"></div><div class="field"><label for="output-limit">最大输出（tokens）</label><input class="input mono" id="output-limit" inputmode="numeric" value="128000"></div></div></section>
          <section class="form-section" aria-labelledby="capabilities-title"><h3 id="capabilities-title">能力</h3><div class="cap-grid">
            <label class="switch-cell"><span>推理</span><input type="checkbox" checked><span class="switch" aria-hidden="true"></span></label><label class="switch-cell"><span>附件</span><input type="checkbox" checked><span class="switch" aria-hidden="true"></span></label><label class="switch-cell"><span>工具</span><input type="checkbox" checked><span class="switch" aria-hidden="true"></span></label><label class="switch-cell"><span>Temp</span><input type="checkbox"><span class="switch" aria-hidden="true"></span></label>
          </div><div class="modalities"><div class="modality-row"><span class="field-label">输入模态</span><div class="chip-set"><label class="check-chip"><input type="checkbox" checked><span>text</span></label><label class="check-chip"><input type="checkbox" checked><span>image</span></label><label class="check-chip"><input type="checkbox"><span>audio</span></label><label class="check-chip"><input type="checkbox"><span>video</span></label><label class="check-chip"><input type="checkbox" checked><span>pdf</span></label></div></div><div class="modality-row"><span class="field-label">输出模态</span><div class="chip-set"><label class="check-chip"><input type="checkbox" checked><span>text</span></label><label class="check-chip"><input type="checkbox"><span>image</span></label><label class="check-chip"><input type="checkbox"><span>audio</span></label></div></div></div></section>
          <section class="form-section" aria-labelledby="levels-title"><h3 id="levels-title">思考档位</h3><div class="level-set">
            <span class="level-chip"><input id="level-low" type="radio" name="default-level"><label for="level-low">low</label><button class="level-remove" type="button" aria-label="删除 low 档">×</button></span>
            <span class="level-chip"><input id="level-medium" type="radio" name="default-level"><label for="level-medium">medium</label><button class="level-remove" type="button" aria-label="删除 medium 档">×</button></span>
            <span class="level-chip"><input id="level-high" type="radio" name="default-level"><label for="level-high">high</label><button class="level-remove" type="button" aria-label="删除 high 档">×</button></span>
            <span class="level-chip"><input id="level-xhigh" type="radio" name="default-level" checked><label for="level-xhigh">xhigh<small>默认</small></label><button class="level-remove" type="button" aria-label="删除 xhigh 档">×</button></span>
            <span class="level-chip"><input id="level-max" type="radio" name="default-level"><label for="level-max">max</label><button class="level-remove" type="button" aria-label="删除 max 档">×</button></span>
          </div><div class="new-level"><label class="field-label" for="new-level">新增档位</label><div class="inline-input"><input class="input" id="new-level" placeholder="输入档位名称"><button class="btn-add" type="button">添加</button></div></div></section>
        </form>
      </div>
    </div></main>
  </div>
  <div class="save-bar"><div class="save-inner"><span class="save-note"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7.5"/><path d="M10 9v5m0-8v.2"/></svg>仅保存预填值，不锁定模型参数</span><div class="save-actions"><button class="btn btn-cancel" type="button">取消</button><button class="btn btn-primary" type="button">保存模板</button></div></div></div>
</body>
</html>
