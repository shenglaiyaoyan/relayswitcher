appId: com.relayswitcher.app
productName: RelaySwitcher
directories:
  output: release
publish:
  - provider: github
    owner: shenglaiyaoyan
    repo: relayswitcher
files:
  - electron/**/*
  - dist/**/*
  - package.json
extraResources:
  - from: resources
    to: resources
win:
  target: nsis
  icon: build/icon.ico
  # 2026-09-23 起恢复 rcedit 编辑(win32 走 app-builder 自带二进制,不碰 winCodeSign/darwin symlink;
  # 签名无证书自动跳过)。exe 由此内嵌自定义图标/版本信息——此前 signAndEditExecutable:false
  # 是为历史解压问题做的过度防御,副作用是 exe/快捷方式全是 Electron 默认蓝灰原子图标
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: RelaySwitcher-Setup-${version}.exe
