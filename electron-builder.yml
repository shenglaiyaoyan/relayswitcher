appId: com.relayswitcher.app
productName: RelaySwitcher
directories:
  output: release
publish:
  - provider: github
    owner: shenglaiyaoyan
    repo: relayswitcher
files:
  - electron/**/*
  - dist/**/*
  - package.json
extraResources:
  - from: resources
    to: resources
win:
  target: nsis
  icon: build/icon.ico
  # 无管理员特权的机器上必须关闭:electron-builder 每次打包都会重新下载 winCodeSign 包,
  # 其中 darwin/10.12/lib/*.dylib 是符号链接,非管理员解压必失败(重试换新缓存 ID 也绕不过)。
  # 代价是 exe 不会自动内嵌图标/版本信息 → 打包后跑 scripts/patch-icon.ps1 补上,
  # 再用 `electron-builder --prepackaged release/win-unpacked` 重新生成安装包。
  # 有符号链接特权(管理员/开发者模式)的机器可删掉这行恢复自动编辑。
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: RelaySwitcher-Setup-${version}.exe
