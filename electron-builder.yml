appId: com.relayswitcher.app
productName: RelaySwitcher
directories:
  output: release
files:
  - electron/**/*
  - dist/**/*
  - package.json
extraResources:
  - from: resources
    to: resources
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: RelaySwitcher-Setup-${version}.exe
