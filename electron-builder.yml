appId: com.relayswitcher.app
productName: RelaySwitcher
directories:
  output: release
publish:
  - provider: github
    owner: shenglaiyaoyan
    repo: relayswitcher
files:
  - electron/**/*
  - dist/**/*
  - package.json
extraResources:
  - from: resources
    to: resources
win:
  target: nsis
  icon: build/icon.ico
  # 非管理员打包环境跳过 rcedit 编辑(winCodeSign 缓存含 darwin symlink,无特权解压必挂)
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: RelaySwitcher-Setup-${version}.exe
